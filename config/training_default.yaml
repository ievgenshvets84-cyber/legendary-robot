# ---------------------------------------------------------------------------
# LLM-Forge – Standard-Trainingskonfiguration
# ---------------------------------------------------------------------------

# Optimierung
learning_rate: 3.0e-4     # Spitzen-Lernrate nach dem Warmup
min_lr_ratio: 0.1         # Endlernrate = learning_rate * min_lr_ratio (Kosinus-Abkühlung)
weight_decay: 0.1         # AdamW Weight Decay (Norm- und Bias-Parameter ausgenommen)
beta1: 0.9
beta2: 0.95
grad_clip: 1.0            # Gradient Clipping (globale L2-Norm)

# Ablaufsteuerung
max_steps: 2000           # Gesamtzahl der Optimierungsschritte
warmup_steps: 100         # Lineares Lernraten-Warmup
batch_size: 8             # Sequenzen pro Mikro-Batch
grad_accum_steps: 4       # Gradientenakkumulation (effektive Batchgröße = batch_size * grad_accum_steps)
seq_len: 1024             # Trainings-Sequenzlänge (<= max_seq_len des Modells)

# Auswertung und Checkpoints
eval_interval: 200        # Alle n Schritte auf dem Validierungssplit evaluieren
eval_batches: 20          # Anzahl Batches pro Evaluierung
checkpoint_interval: 500  # Alle n Schritte einen Checkpoint schreiben
keep_checkpoints: 3       # Nur die letzten n Checkpoints behalten (Bestwert bleibt immer erhalten)
log_interval: 10          # Alle n Schritte Metriken protokollieren

# Hardware
device: "auto"            # "auto" | "cuda" | "cpu"
mixed_precision: true     # Automatic Mixed Precision (bfloat16/float16) auf CUDA
compile: false            # torch.compile aktivieren (schneller, aber längerer Start)
num_workers: 2            # DataLoader-Workerprozesse
seed: 42                  # Reproduzierbarkeit

# Daten
val_split: 0.01           # Anteil der Daten für die Validierung
