[project]
name = "llm-forge"
version = "0.1.0"
description = "Ein vollständiges Framework zum Entwickeln, Trainieren und Betreiben eines eigenen großen Sprachmodells (LLM) von Grund auf."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "LLM-Forge" }]
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
# Export nach ONNX
export = ["onnx>=1.16"]
# Optionale Wissensdistillation von offenen Referenzmodellen (Gemma, Llama, Mistral)
distill = ["transformers>=4.41", "safetensors>=0.4"]
# GPU-Telemetrie (nvidia-ml)
gpu = ["nvidia-ml-py>=12.0"]
# Entwicklung und Tests
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
llm-forge = "backend.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "backend",
    "backend.routers",
    "backend.services",
    "models",
    "tokenizer",
    "training",
    "inference",
    "evaluation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
