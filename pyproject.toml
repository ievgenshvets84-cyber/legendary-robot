[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localmind"
version = "0.1.0"
description = "Локальный автономный ИИ-агент на открытых моделях: память, инструменты, самопрограммирование навыков"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
media = ["Pillow>=10.0"]
train = [
    "torch>=2.1",
    "transformers>=4.44",
    "peft>=0.12",
    "datasets>=2.20",
    "accelerate>=0.33",
]

[project.scripts]
localmind = "localmind.cli:main"

[tool.setuptools.packages.find]
include = ["localmind*"]
