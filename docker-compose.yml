# LLM-Forge – Docker Compose
#
# CPU:  docker compose up llm-forge
# GPU:  docker compose --profile gpu up llm-forge-gpu
services:
  llm-forge:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      # Persistente Daten außerhalb des Containers halten
      - ./datasets:/app/datasets
      - ./checkpoints:/app/checkpoints
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - LLM_FORGE_HOST=0.0.0.0
      - LLM_FORGE_PORT=8000

  llm-forge-gpu:
    profiles: ["gpu"]
    build:
      context: .
      args:
        BASE_IMAGE: nvidia/cuda:12.1.1-runtime-ubuntu22.04
        TORCH_INDEX: https://download.pytorch.org/whl/cu121
    ports:
      - "8000:8000"
    volumes:
      - ./datasets:/app/datasets
      - ./checkpoints:/app/checkpoints
      - ./exports:/app/exports
      - ./logs:/app/logs
      - ./config:/app/config
    environment:
      - LLM_FORGE_HOST=0.0.0.0
      - LLM_FORGE_PORT=8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
